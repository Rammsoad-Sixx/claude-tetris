name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

concurrency:
  group: issue-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Issue Triage
        id: claude-triage
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Analiza el issue #${{ github.event.issue.number }} de este repositorio (evento: ${{ github.event_name }}, acción: ${{ github.event.action }}).

            1. Lee el título y cuerpo del issue con `gh issue view ${{ github.event.issue.number }}`.
            2. Lista los labels existentes del repo con `gh label list`. Elige SOLO entre los labels que ya existen (no crees labels nuevos) los que apliquen a este issue (puede ser más de uno).
            3. Aplica los labels elegidos con `gh issue edit ${{ github.event.issue.number }} --add-label "..."`. No quites labels que ya haya puesto una persona manualmente salvo que sean claramente incorrectos.
            4. Revisa los comentarios existentes del issue. Si tú (Claude) ya dejaste un comentario de diagnóstico anteriormente y el diagnóstico no cambia de forma relevante con esta edición, NO comentes de nuevo. Si es la primera vez, o el diagnóstico cambia sustancialmente, publica un comentario breve (máx. 5-6 líneas) con: (a) tipo de problema, (b) severidad estimada (baja/media/alta), (c) próximos pasos sugeridos.

            Sé conciso y evita ruido innecesario en el issue.
